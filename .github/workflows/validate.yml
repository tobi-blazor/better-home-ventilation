name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # The HACS action validates the repository through the GitHub API on the
    # default branch, not the checked-out pull request, so it only runs on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The repository is private for now: no brands entry, topics or
          # description yet, and no license until the owner decides (spec Q5).
          # Remove before the HACS default listing (M12).
          ignore: brands topics description license
