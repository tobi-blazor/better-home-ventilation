rules:
  # Bronze
  action-setup:
    status: done
    comment: Services are registered in async_setup and resolve the entry per call.
  appropriate-polling:
    status: exempt
    comment: No polling. The integration is event driven (state changes, timers); iot_class is calculated.
  brands: todo
  common-modules: todo
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the manifest has an empty requirements list.
  docs-actions:
    status: done
    comment: README "Actions" lists every action with its fields, defaults and errors, including override_safety.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description:
    status: done
    comment: README "What it does"; a helper without a device brand of its own.
  docs-installation-instructions:
    status: done
    comment: README "Requirements and supported units" and "Installation" (HACS custom repository or manual copy).
  docs-removal-instructions:
    status: done
    comment: README "Removal".
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: Helper without a connection. Setup never depends on the source entities, which may load later; missing entities count as invalid inputs and problems.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README "Options", "Readiness conditions" and "Warning sources" document every field of every options step and subentry flow with UI name, default and meaning, checked against strings.json.
  docs-installation-parameters:
    status: done
    comment: README "Setup" documents every field of the three config flow steps.
  entity-unavailable:
    status: exempt
    comment: Entities are calculated by the controller and stay available while the entry is loaded; failed inputs and an unavailable actuator are shown in attributes and the problem sensor.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication; the integration only uses entities of the same Home Assistant instance.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: Helper integration without a device or service to discover.
  discovery-update-info:
    status: exempt
    comment: Helper integration without a device or service to discover.
  docs-data-update:
    status: done
    comment: README "When the setpoint is updated" (event driven evaluation, debounce, periodic evaluation, startup grace, input validity).
  docs-examples:
    status: done
    comment: README "Examples" (automations calling the actions) and examples/dashboard.yaml.
  docs-known-limitations:
    status: done
    comment: README "What 0.1 does not do yet" and "Limitations and FAQ".
  docs-supported-devices:
    status: done
    comment: README "Requirements and supported units"; any unit controllable through a number, fan or select entity, no device-specific code.
  docs-supported-functions:
    status: done
    comment: README "Entities", "Profiles", "How the setpoint is calculated", "Actions" and "Events and logbook".
  docs-troubleshooting:
    status: done
    comment: README "Troubleshooting".
  docs-use-cases:
    status: done
    comment: README "Use cases".
  dynamic-devices:
    status: exempt
    comment: Exactly one device per config entry, created with the entry. Entities added to a warning source device (for example a new NINA slot) are followed without a reload.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is used in daily operation or for diagnosis; none is noisy enough to be disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: entry.data is empty; every setting, including the actuator, is changed in the options flow (helper pattern).
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Exactly one device per config entry, removed together with the entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: No external library.
  inject-websession:
    status: exempt
    comment: No HTTP connections.
  strict-typing: todo
