rules:
  # Bronze
  action-setup: todo
  appropriate-polling:
    status: exempt
    comment: No polling. The integration is event driven (state changes, timers); iot_class is calculated.
  brands: todo
  common-modules: todo
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the manifest has an empty requirements list.
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: todo
  entity-unique-id: todo
  has-entity-name: todo
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: Helper without a connection. Setup never depends on the source entities, which may load later; missing entities count as invalid inputs and problems.
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: No authentication; the integration only uses entities of the same Home Assistant instance.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: Helper integration without a device or service to discover.
  discovery-update-info:
    status: exempt
    comment: Helper integration without a device or service to discover.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Exactly one device per config entry, created with the entry.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: entry.data is empty; every setting, including the actuator, is changed in the options flow (helper pattern).
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Exactly one device per config entry, removed together with the entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: No external library.
  inject-websession:
    status: exempt
    comment: No HTTP connections.
  strict-typing: todo
